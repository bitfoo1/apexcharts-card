name: 'Close stale issues and PR'
# Disabled in this fork. Upstream's stale bot is why real bugs such as #1031
# and #1055 kept getting auto-closed and had to be revived by hand; a fork with
# a handful of issues has nothing to gain from it. Kept as a manual trigger
# only so the file does not diverge structurally from upstream.
on: workflow_dispatch

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue is stale because it has been open 30 days with no activity. Remove stale label or comment or this will be closed in 10 days.'
          close-issue-message: 'This issue was closed because it has been stalled for 10 days with no activity.'
          days-before-issue-stale: 60
          days-before-issue-close: 10
          days-before-pr-close: -1
          days-before-pr-stale: -1
          exempt-issue-labels: 'ApexCharts.JS,released on @dev'
